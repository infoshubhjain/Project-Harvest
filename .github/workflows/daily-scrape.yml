name: Daily Dining Hall Data Scrape

on:
  schedule:
    # Target 8:00 AM America/Chicago.
    # GitHub Actions cron is UTC-only, so use seasonal UTC offsets:
    # - 14:00 UTC ~= 8:00 AM CST (roughly Nov-Feb)
    # - 13:00 UTC ~= 8:00 AM CDT (roughly Mar-Oct)
    - cron: '0 14 * 1,2,11,12 *'
    - cron: '0 13 * 3-10 *'
  workflow_dispatch:
    inputs:
      testing:
        description: 'Enable testing mode to run a limited, fast scrape'
        required: false
        default: 'false'
      save_snapshots:
        description: 'Save HTML snapshots for debugging when selectors fail'
        required: false
        default: 'false'

# Write access is required to commit the updated DB and JSON files back to the repo.
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    concurrency:
      # Prevent two scrapes from running at the same time on the same branch,
      # which could cause conflicting commits to the DB file.
      group: daily-scrape-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd Backend/scrapers
          pip install -r requirements.txt

      - name: Run scraper
        run: |
          cd Backend/scrapers
          # Build optional flags from workflow_dispatch inputs; empty string if not set.
          TESTING=''
          if [ "${{ github.event.inputs.testing }}" = 'true' ]; then
            TESTING='--testing'
          fi
          SAVESNAP=''
          if [ "${{ github.event.inputs.save_snapshots }}" = 'true' ]; then
            SAVESNAP='--save-snapshots'
          fi
          # Scrape 5 days (today + 4 ahead) so the frontend always has upcoming menus.
          python3 nutrition_scraper.py --days 5 $TESTING $SAVESNAP
        # Long timeout because each menu item requires opening a nutrition modal via Selenium.
        timeout-minutes: 150

      - name: Load scraped data into database
        run: |
          cd Backend/scrapers
          # Reads the most-recent .xlsx produced by the scraper and upserts it into nutrition_data.db.
          python3 load_to_db.py

      - name: Export JSON API files
        run: |
          cd Backend
          # Writes per-hall JSON files to Docs/api/ (served by GH Pages) and
          # webapp/public/api/ (used by the Vite dev server locally).
          python3 export_to_json.py

      - name: Commit and push updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Docs/api/ webapp/public/api/ Backend/data/nutrition_data.db
          # --quiet exits 0 when nothing changed, preventing an empty commit.
          git diff --staged --quiet || git commit -m "🤖 Auto-update dining hall data & API - $(date +'%Y-%m-%d %H:%M')"
          git push
        # continue-on-error so a push conflict (rare) doesn't fail the whole scrape.
        continue-on-error: true
