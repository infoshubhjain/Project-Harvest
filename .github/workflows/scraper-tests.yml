name: Scraper Tests

# Run the test suite on every push and PR to master so broken selectors are
# caught before the next daily scrape runs against the live site.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd Backend/scrapers
          pip install -r requirements.txt

      - name: Run selector playback tests
        run: |
          cd Backend/scrapers
          # -q keeps output concise; tests/ contains playback and remote-structure tests.
          pytest -q tests
