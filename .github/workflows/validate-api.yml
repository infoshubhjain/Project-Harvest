name: Validate API JSON and Repair

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd Backend/scrapers
          pip install -r requirements.txt

      - name: Run JSON validator
        id: validate
        run: |
          python3 Backend/scripts/validate_docs_api.py
          echo "valid=true" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Repair invalid JSON via quick scrape
        if: steps.validate.outputs.valid != 'true'
        run: |
          echo "Invalid JSON detected — running quick scrape to repair"
          cd Backend/scrapers
          python3 nutrition_scraper.py --testing
          python3 load_to_db.py
          cd ..
          python3 export_to_json.py
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Docs/api/ webapp/public/api/
          git diff --staged --quiet || git commit -m "🤖 Auto-fix: repaired invalid API JSON - $(date +'%Y-%m-%d %H:%M')"
          git push
